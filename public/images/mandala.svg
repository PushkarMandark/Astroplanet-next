<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" stroke="currentColor" stroke-width="1">
  <g transform="translate(300 300)">
    <!-- Outer ring with tick marks -->
    <circle r="290" stroke-opacity="0.4" />
    <circle r="280" stroke-opacity="0.25" />
    <g stroke-opacity="0.5">
      <!-- 60 tick marks around outer ring -->
      <g id="ticks">
        <line x1="0" y1="-290" x2="0" y2="-270" />
      </g>
    </g>

    <!-- 12 petals around center (lotus-like) -->
    <g stroke-opacity="0.55">
      <g id="petals">
        <path d="M 0,-260 C 30,-200 30,-120 0,-80 C -30,-120 -30,-200 0,-260 Z" />
      </g>
    </g>

    <!-- Inner sacred geometry -->
    <circle r="220" stroke-opacity="0.3" />
    <circle r="200" stroke-opacity="0.45" stroke-dasharray="4 6" />
    <circle r="160" stroke-opacity="0.3" />
    <circle r="120" stroke-opacity="0.35" />

    <!-- 8-point star -->
    <g stroke-opacity="0.4">
      <polygon points="0,-160 38,-38 160,0 38,38 0,160 -38,38 -160,0 -38,-38" fill="none" />
      <polygon points="0,-160 38,-38 160,0 38,38 0,160 -38,38 -160,0 -38,-38" fill="none" transform="rotate(22.5)" />
    </g>

    <!-- Center decorative ring -->
    <circle r="80" stroke-opacity="0.5" stroke-dasharray="2 4" />
    <circle r="40" stroke-opacity="0.6" />

    <!-- Inner 6-petal flower -->
    <g stroke-opacity="0.5">
      <circle r="30" cx="0" cy="-25" />
      <circle r="30" cx="22" cy="-12" />
      <circle r="30" cx="22" cy="12" />
      <circle r="30" cx="0" cy="25" />
      <circle r="30" cx="-22" cy="12" />
      <circle r="30" cx="-22" cy="-12" />
    </g>

    <!-- Render the ticks 60 times via SVG transforms -->
    <g stroke-opacity="0.45">
      <line x1="0" y1="-290" x2="0" y2="-275" />
      <line x1="0" y1="-290" x2="0" y2="-275" transform="rotate(6)" />
      <line x1="0" y1="-290" x2="0" y2="-275" transform="rotate(12)" />
      <line x1="0" y1="-290" x2="0" y2="-275" transform="rotate(18)" />
      <line x1="0" y1="-290" x2="0" y2="-275" transform="rotate(24)" />
