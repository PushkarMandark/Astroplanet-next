      <path d="M 0,-250 C 25,-200 25,-130 0,-90 C -25,-130 -25,-200 0,-250 Z" />
      <path d="M 0,-250 C 25,-200 25,-130 0,-90 C -25,-130 -25,-200 0,-250 Z" transform="rotate(30)" />
      <path d="M 0,-250 C 25,-200 25,-130 0,-90 C -25,-130 -25,-200 0,-250 Z" transform="rotate(60)" />
